name: f7zip
description: '基于 7-Zip 原生引擎的跨平台桌面压缩工具'
publish_to: none
version: 0.2.2+4
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  crypto: ^3.0.7
  desktop_drop: ^0.7.1
  path: ^1.9.1
  window_manager: ^0.5.2
  file_selector: ^1.0.4
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2
  media_kit: ^1.2.0
  media_kit_video: ^2.0.0
  media_kit_libs_video: ^1.0.6
  pdfrx: ^2.2.0
  super_drag_and_drop: ^0.9.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
